# AUTOLOOP al-09 / 工单 1009：bug 报告表单（借鉴 kubernetes issue-forms）
name: Bug 报告
description: 报告可复现的缺陷
labels: ["bug"]
body:
  - type: input
    id: branch
    attributes:
      label: 分支/版本
      placeholder: "online-main @ <commit>"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图（注意脱敏，勿贴密钥）
