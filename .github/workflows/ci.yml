name: CI

on:
  pull_request:
    branches: [online]
  push:
    branches: [online]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 检出跨仓库依赖：agent-rag-observability-server-client 模块
      - name: 检出 agent-rag-observability-server（跨仓库依赖）
        uses: actions/checkout@v4
        with:
          repository: chyuan-cuihongyuan/agent-rag-observability-server
          token: ${{ secrets.SUBMODULE_TOKEN }}
          path: agent-rag-observability-server-deps
          ref: online
          fetch-depth: 1

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: 配置 Maven Settings（Maven Central 优先）
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>maven-central</id>
                <name>Maven Central</name>
                <url>https://repo.maven.apache.org/maven2</url>
                <mirrorOf>*</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      # 先构建并安装跨仓库依赖 client 模块（含其依赖 types）
      - name: 安装 agent-rag-observability-server-client 到本地仓库
        env:
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        run: |
          cd agent-rag-observability-server-deps
          mvn -B install -pl agent-rag-observability-server-types,agent-rag-observability-server-client -am -DskipTests -Daether.checksums.forSignature=false -Daether.connector.connectTimeout=30s -Daether.connector.requestTimeout=120s

      - name: 编译验证
        env:
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        run: mvn -B compile -Daether.checksums.forSignature=false -Daether.connector.connectTimeout=30s -Daether.connector.requestTimeout=120s

      - name: 运行测试
        env:
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        run: mvn -B test -Daether.checksums.forSignature=false -Daether.connector.connectTimeout=30s -Daether.connector.requestTimeout=120s

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
