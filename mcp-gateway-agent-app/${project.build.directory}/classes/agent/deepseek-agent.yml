ai:
  agent:
    config:
      tables:
        deepseekAgent:
          app-name: deepseekAgent
          agent:
            agent-id: 100005
            agent-name: DeepSeek智能体
            agent-desc: DeepSeek模型智能体
          module:
            ai-api:
              provider: deepseek
              base-url: https://api.deepseek.com
              api-key: your-deepseek-api-key
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-chat
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: sse?api_key=your-baidu-api-key
                    request-timeout: 500000
            agents:
              - name: deepseekAgent
                description: DeepSeek模型智能助手
                instruction: |
                  你是一个专业的 AI 助手。
            runner:
              agent-name: deepseekAgent
              plugin-name-list:
                - myTestPlugin
